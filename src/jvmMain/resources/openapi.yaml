webhooks: {}
components:
  schemas:
    LoginRequestDto:
      type: object
      title: LoginRequestDto
      properties:
        email:
          type:
          - string
          - "null"
        password:
          type:
          - string
          - "null"
    ErrorDto:
      type: object
      title: ErrorDto
      required:
      - reason
      properties:
        reason:
          type: string
    RegisterRequestDto:
      type: object
      title: RegisterRequestDto
      required:
      - email
      - password
      - repeatedPassword
      properties:
        email:
          type: string
        password:
          type: string
        repeatedPassword:
          type: string
    CategoryDto:
      type: object
      title: CategoryDto
      required:
      - id
      - name
      properties:
        id:
          type: string
